services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        CAMINO_ATTACH: ${CAMINO_ATTACH:-}
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      CAMINO_ATTACH: ${CAMINO_ATTACH:-}
    ports:
      - "8050:8050"
    restart: unless-stopped
